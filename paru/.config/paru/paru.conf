#
# ~/.config/paru/paru.conf
#

[options]
# Prompt before importing unknown PGP keys
PgpFetch
# Check development packages such as *-git
Devel
# Resolve dependencies through "provides"
Provides
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil
# Show AUR results first
BottomUp
# Remove build dependencies after installation
RemoveMake
# Keep sudo credentials active during long builds
SudoLoop
# Remove untracked build files after successful installation
CleanAfter
# Show Arch Linux news before system upgrades
NewsOnUpgrade
#AurOnly
# UseAsk
SaveChanges
CombinedUpgrade
UpgradeMenu
# Advanced build modes
#LocalRepo
#Chroot
#Sign
#SignDb
#KeepRepoCache
[bin]
# Review PKGBUILDs and related files using Ranger
FileManager = ranger
# Never disable package verification globally
#MFlags = --skippgpcheck
# Use sudo by default
#Sudo = doas
