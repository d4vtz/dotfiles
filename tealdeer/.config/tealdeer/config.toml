[style.command_name]
foreground = { rgb = { r = 189, g = 147, b = 249 } }
underline = false
bold = true
italic = true

[style.example_text]
foreground = { rgb = { r = 139, g = 233, b = 253 } }
underline = false
bold = true
italic = true

[style.example_code]
foreground = { rgb = { r = 80, g = 250, b = 123 } }
underline = false
bold = false
italic = false

[style.example_variable]
foreground = { rgb = { r = 255, g = 184, b = 108 } }
underline = true
bold = false
italic = false

[display]
compact = false
use_pager = false
show_title = true

[style.description]
foreground = { rgb = { r = 248, g = 248, b = 242 } }


[updates]
auto_update = true
auto_update_interval_hours = 720
archive_source = "https://github.com/tldr-pages/tldr/releases/latest/download/"
tls_backend = "rustls-with-webpki-roots"

[directories]

[search]
languages = ["es", "en"]
platforms = ["linux", "common"]
